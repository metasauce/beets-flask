[project]
name = "beets-flask"
description = "An opinionated web-interface around the music organizer [beets](https://beets.io/)"
version = "2.0.0-rc6"
authors = [
    { name = "F. Paul Spitzner", email = "paul.spitzner@gmail.com" },
    { name = "Sebastian B. Mohr", email = "sebastian@mohrenclan.de" },
]
requires-python = "==3.12.*"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "quart>=0.20.0",
    "confuse>=2.0.1",
    "beets==2.14.0",
    "sqlalchemy>=2.0.35",
    "rq>=2.0.0",
    "watchdog>=5.0.3",
    "requests>=2.32.3",
    "python-socketio>=5.11.4",
    "pillow>=10.4.0",
    "cachetools>=5.3.3",
    "libtmux>=0.37.0",
    "Deprecated>=1.2.18",
    # Used for hosting the web-interface & api
    "uvicorn>=0.36.0",
    "uvloop>=0.22.1",
    # beets plugin dependencies
    "pylast>=5.2.0",
    "python2ts>=0.7.2",
    "eyconf[pydantic]>=0.8.0",
    #"scantree>=0.0.4",
    "natsort",
    "tinytag",
    "pydub",
    "aiohttp",
    "aiofiles",
    "numpy",
    "typing_extensions",
    "polars>=1.36.1",
    "alembic>=1.18.4",
]

[dependency-groups]
dev = [
    { include-group = "test" },
    { include-group = "docs" },
    { include-group = "typed" },
    "ruff>=0.6.5",
    "pre-commit>=3.8.0",
]

# Can be install with e.g. `pip install -e .[dev]`
test = [
    "pytest>=8.2.2",
    "pytest-benchmark>=5.2.3",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "fakeredis",
]
docs = [
    "sphinx>=8.0.2",
    "furo>=2024.8.6",
    "sphinx-copybutton>=0.5.2",
    "sphinx-inline-tabs>=2023.4.21",
    "sphinxcontrib-typer[html]>=0.5.0",
    "sphinxcontrib-mermaid>=2.0.1",
    "myst-parser>=4.0.0",
    "myst-nb>=1.1.2",
    "paracelsus>=0.15.0",
]
typed = [
    "types-cachetools",
    "types-requests",
    "mypy>=1.14.1",
    "types-cachetools",
    "types-Deprecated",
    "types-aiofiles",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["beets_flask"]

[tool.ruff]
include = [
    "pyproject.toml",
    "beets_flask/**/*.py",
    "tests/**/*.py",
]
target-version = "py312"

[tool.ruff.lint]
future-annotations = true
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "ISC", # flake8-implicit-str-concat
    "N",   # pep8-naming
    "RUF", # ruff
    "UP",  # pyupgrade
    "TC",  # flake8-type-checking
    "D",   # pydocstyle
    "W",   # pycodestyle
    # PTH is disabled, it has no working autofixes in current ruff versions
    # and the remaining issues are not worth the manual churn.
]
ignore = [
    # Ignore req. for public facing functions docstrings
    "D10",
    "D202",
    "D401",
    # Incompatible with D211/D212, which we enforce instead:
    "D203", # blank line before class docstring (use D211: none)
    "D213", # summary on second line (use D212: first line)
    "TC006", # no need to quote 'cast's since we use 'from __future__ import annotations'
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*" = ["D"]
"**/alembic/**/*" = ["D", "I"]
# SQLAlchemy resolves Mapped[...] annotations at runtime, so these imports
# must stay outside TYPE_CHECKING blocks.
"**/beets_flask/database/models/*" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.isort]
known-first-party = ["beets_flask", "tests"]
known-third-party = ["alembic", "sqlalchemy"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib", "--cov=beets_flask", "--cov-report=html"]
filterwarnings = [
    "error",
    "ignore::sqlalchemy.exc.SAWarning",
    "ignore::DeprecationWarning",
]
pythonpath = ["."]
log_format = "%(relativeCreated)-8d [%(levelname)-5s] %(name)s %(filename)-8s:%(lineno)d %(message)s"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "function"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.report]
omit = ["*/tests/*"]
exclude_also = [
    "if TYPE_CHECKING",
    "raise AssertionError",
    "raise NotImplementedError",
]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_decorators = true
allow_redefinition = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# Suppresses error messages about imports that cannot be resolved.
module = ["socketio.*", "confuse.*", "mediafile.*", "eyconf.*"]
ignore_missing_imports = true
follow_untyped_imports = true

[tool.uv]
exclude-newer = "3 days"
# maintained alongside this project; skip the supply-chain
# quarantine delay so new releases can be picked up immediately.
exclude-newer-package = { python2ts = false, beets = false }
